version: 1

backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - echo "$AWS_BRANCH"
        - echo "$MODEL_AI_ARN"
        - echo "$ACCOUNT_ID"
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm run seed        # ← run your seeding script here
    build:
      commands:
        - echo "Available build vars:"
        - env | grep -e '^TCV_'        # prints to log
        - echo "Done grep..."
        - env | grep -e '^TCV_' >> .env.production  # writes into file
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
